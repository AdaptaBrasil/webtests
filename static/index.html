<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdaptaBrasil - Mapa de Indicadores</title>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #filters {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 24px;
    padding: 12px 16px;
    background: #f4f4f4;
    border-bottom: 1px solid #ddd;
  }
  #filterFields { display: flex; flex-direction: column; gap: 12px; }
  .field.debug-toggle {
    flex-direction: row;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    align-self: center;
  }
  #debugPanel { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 300px; }
  #debugPanel[hidden] { display: none; }
  #debugPanel .debug-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #333;
  }
  #debugPanel .debug-header span { flex: 1; }
  #debugPanel button { font-size: 12px; padding: 2px 10px; cursor: pointer; }
  #debugSql {
    flex: 1;
    min-height: 90px;
    resize: vertical;
    font: 12px/1.4 Consolas, "Courier New", monospace;
    white-space: pre;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 6px 8px;
    background: #fff;
  }
  .filters-row {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }
  .field { display: flex; flex-direction: column; min-width: 220px; }
  .field label { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #333; }
  select {
    font-size: 14px;
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
  #loadMap {
    font-size: 14px;
    font-weight: 600;
    padding: 8px 22px;
    border: none;
    border-radius: 4px;
    background: #1e6f42;
    color: #fff;
    cursor: pointer;
  }
  #loadMap:disabled { background: #a9a9a9; cursor: not-allowed; }
  #loadStatus { font-size: 13px; color: #555; align-self: center; }
  #map { flex: 1; width: 100%; }
  .maplibregl-popup-content { font-size: 13px; padding: 8px 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="filters">
   <div id="filterFields">
    <div class="filters-row">
      <div class="field">
        <label for="sep">Setor estratégico</label>
        <select id="sep"><option value="">(selecione)</option></select>
      </div>
      <div class="field">
        <label for="indicator">Indicador</label>
        <select id="indicator" disabled><option value="">(selecione)</option></select>
      </div>
    </div>
    <div class="filters-row">
      <div class="field">
        <label for="state">Estado</label>
        <select id="state"><option value="">(selecione)</option></select>
      </div>
      <div class="field">
        <label for="county">Município</label>
        <select id="county" disabled><option value="">(selecione)</option></select>
      </div>
      <div class="field">
        <button id="loadMap" disabled>Exibir mapa</button>
      </div>
      <label class="field debug-toggle">
        <input type="checkbox" id="debug"> Debug
      </label>
      <div class="field">
        <span id="loadStatus"></span>
      </div>
    </div>
   </div>
    <div id="debugPanel" hidden>
      <div class="debug-header">
        <span>SQL executado (parâmetros já incluídos)</span>
        <button type="button" id="debugCopy">Copiar</button>
        <button type="button" id="debugClear">Limpar</button>
      </div>
      <textarea id="debugSql" readonly spellcheck="false"></textarea>
    </div>
  </div>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
